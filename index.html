<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCL PRO 2026 LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@600;800&display=swap');
body{font-family:'Inter',sans-serif;background:#020617;color:white}
.oswald{font-family:'Oswald',sans-serif}
</style>
</head>
<body class="p-2 md:p-4">
<div class="max-w-6xl mx-auto">
<div class="bg-[#0f172a] rounded-2xl border border-slate-800 p-3 flex justify-between items-center">
<div class="flex gap-2"><input id="teamA" value="TEAM A" class="bg-black border border-slate-700 rounded px-2 py-1 w-24 font-bold"><span class="text-slate-500 py-1">VS</span><input id="teamB" value="TEAM B" class="bg-black border border-slate-700 rounded px-2 py-1 w-24 font-bold"></div>
<button id="liveBtn" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-full font-black">GO LIVE 🔴</button>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
<div class="bg-[#0f172a] rounded-2xl p-3 border border-slate-800">
<div class="flex justify-between"><h3 id="batTeamName" class="oswald text-xl">TEAM A</h3><span id="score" class="text-3xl font-black">0-0</span></div>
<p id="overs" class="text-slate-400 text-sm">0.0 Overs | CRR 0.00</p>
<div class="grid grid-cols-4 gap-2 mt-3">
<button onclick="addRun(0)" class="bg-slate-800 py-3 rounded-xl font-bold">0</button>
<button onclick="addRun(1)" class="bg-slate-800 py-3 rounded-xl font-bold">1</button>
<button onclick="addRun(2)" class="bg-slate-800 py-3 rounded-xl font-bold">2</button>
<button onclick="addRun(3)" class="bg-slate-800 py-3 rounded-xl font-bold">3</button>
<button onclick="addRun(4)" class="bg-blue-600 py-3 rounded-xl font-bold">4</button>
<button onclick="addRun(6)" class="bg-purple-600 py-3 rounded-xl font-bold">6</button>
<button onclick="addWicket()" class="bg-red-600 py-3 rounded-xl font-bold">W</button>
<button onclick="addRun(1,true)" class="bg-orange-600 py-3 rounded-xl font-bold">WD</button>
</div>
<button onclick="undo()" class="w-full mt-3 bg-slate-900 py-2 rounded-xl text-sm">UNDO</button>
</div>

<div class="md:col-span-2 bg-black rounded-2xl border-4 border-slate-800 overflow-hidden relative h-[380px] flex flex-col justify-center items-center">
<div id="liveBadge" class="hidden absolute top-3 left-3 bg-red-600 px-3 py-1 rounded-full text-xs font-black animate-pulse">● LIVE SYNC ON</div>
<h1 id="mainScore" class="oswald text-8xl">0-0</h1>
<p id="mainOvers" class="text-slate-400">0.0 (0) | CRR 0.00</p>
<div id="thisOver" class="flex gap-2 mt-4"></div>
<p class="absolute bottom-2 text-[10px] text-slate-600">Laptop se control karo | Mobile/Link pe Auto Live</p>
</div>
</div>

<p id="status" class="text-center text-xs mt-3 text-green-400">Firebase Connected: tcl-live-97</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjbjMJa3EF0695zwbFZDo00tULrQd-Ux8",
  authDomain: "tcl-live-97.firebaseapp.com",
  databaseURL: "https://tcl-live-97-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tcl-live-97",
  storageBucket: "tcl-live-97.firebasestorage.app",
  messagingSenderId: "657997610797",
  appId: "1:657997610797:web:851cd00fc197fafa4bdda4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const matchRef = ref(db, 'tcl/live/match1');

let runs=0, wickets=0, balls=0, history=[], overBalls=[], crr=0, isLive=false;

window.addRun = (r,isWide=false)=>{
 history.push({runs,wickets,balls,overBalls:[...overBalls]});
 if(!isWide){ if(r==4||r==6){runs+=r;balls++;} else if(r==0){balls++;} else {runs+=r;balls++;} overBalls.push(r==0?'•':r); } else {runs+=1; overBalls.push('WD');}
 if(balls%6==0 && balls>0) overBalls=[];
 updateUI(); pushLive();
}
window.addWicket = ()=>{
 history.push({runs,wickets,balls,overBalls:[...overBalls]});
 wickets++; balls++; overBalls.push('W'); updateUI(); pushLive();
}
window.undo = ()=>{
 if(!history.length) return; let p=history.pop(); runs=p.runs; wickets=p.wickets; balls=p.balls; overBalls=p.overBalls; updateUI(); pushLive();
}

function updateUI(){
 let ov = Math.floor(balls/6)+"."+(balls%6);
 crr = balls>0? ((runs/(balls/6)).toFixed(2)) : "0.00";
 document.getElementById('score').innerText=runs+"-"+wickets;
 document.getElementById('mainScore').innerText=runs+"-"+wickets;
 document.getElementById('overs').innerText=ov+" Overs | CRR "+crr;
 document.getElementById('mainOvers').innerText=ov+" ("+balls+") | CRR "+crr;
 document.getElementById('batTeamName').innerText=document.getElementById('teamA').value;
 document.getElementById('thisOver').innerHTML=overBalls.map(b=>`<span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${b=='W'?'bg-red-600':b==4||b==6?'bg-blue-600':'bg-slate-800'}">${b}</span>`).join('');
}

function pushLive(){
 if(!isLive) return;
 set(matchRef, { teamA: document.getElementById('teamA').value, teamB: document.getElementById('teamB').value, runs, wickets, balls, overBalls, crr, live:true, updated: Date.now() });
}

document.getElementById('liveBtn').onclick = ()=>{
 isLive=!isLive;
 document.getElementById('liveBtn').innerText=isLive? "LIVE ON ✅" : "GO LIVE 🔴";
 document.getElementById('liveBadge').classList.toggle('hidden',!isLive);
 document.getElementById('status').innerText=isLive? "● LIVE: Laptop se control ho raha hai" : "Offline";
 if(isLive) pushLive();
};

// Listen for live updates (for viewers)
onValue(matchRef, (snap)=>{
 const d=snap.val(); if(!d) return;
 if(!isLive){ runs=d.runs; wickets=d.wickets; balls=d.balls; overBalls=d.overBalls||[]; updateUI(); document.getElementById('teamA').value=d.teamA; document.getElementById('teamB').value=d.teamB; }
});
updateUI();
</script>
</body>
</html>
